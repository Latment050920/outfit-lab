<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutfitLab · 离线穿搭推荐</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="bg-decor" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>OutfitLab</h1>
          <p class="slogan">今日穿搭，一键有型。</p>
        </div>
        <nav class="tabs" aria-label="页面导航">
          <button class="tab-btn is-active" data-tab="recommend" type="button">推荐</button>
          <button class="tab-btn" data-tab="wardrobe" type="button">衣橱</button>
          <button class="tab-btn" data-tab="product-links" type="button">Product Links</button>
          <button class="tab-btn" data-tab="favorites" type="button">收藏</button>
        </nav>
      </header>

      <main>
        <section id="recommend" class="tab-panel is-active">
          <div class="grid-two">
            <article class="card">
              <h2>今天想怎么穿？</h2>
              <div class="form-grid">
                <label>心情
                  <select id="mood"><option>冷静</option><option>开心</option><option>疲惫</option><option>想显气场</option><option>想可爱</option><option>松弛</option></select>
                </label>
                <label>场景
                  <select id="scene"><option>通勤上班</option><option>约会</option><option>休闲娱乐</option><option>运动</option><option>聚会</option><option>旅行</option></select>
                </label>
                <label>温度
                  <div class="segment" id="temp-segment">
                    <button type="button" data-value="cold">冷</button><button type="button" class="is-active" data-value="mild">适中</button><button type="button" data-value="hot">热</button>
                  </div>
                </label>
                <label>正式度目标 <span id="formality-value">5</span><input id="formality" type="range" min="0" max="10" value="5" /></label>
              </div>
              <div class="chip-group" id="style-chips"><p>风格偏好</p><button type="button" class="chip is-active">极简</button><button type="button" class="chip">韩系</button><button type="button" class="chip">美式复古</button><button type="button" class="chip">日系</button><button type="button" class="chip">学院</button><button type="button" class="chip">机能</button></div>
              <div class="chip-group" id="color-chips"><p>颜色倾向</p><button type="button" class="chip is-active">黑白灰</button><button type="button" class="chip">低饱和</button><button type="button" class="chip">亮色点缀</button><button type="button" class="chip">大地色</button></div>
              <div class="btn-row"><button id="generate" class="primary" type="button">生成穿搭</button><button id="reroll" type="button">换一套</button></div>
            </article>
            <article class="card result-card"><h2>推荐结果</h2><div id="result-content" class="skeleton-wrap"></div><div class="btn-row"><button id="favorite" type="button">收藏</button></div></article>
          </div>
        </section>

        <section id="wardrobe" class="tab-panel">
          <article class="card">
            <div class="row-between"><h2>我的衣橱</h2><button id="add-item-btn" type="button">新增单品</button></div>
            <div class="chip-group inline" id="category-filter"></div>
            <div id="wardrobe-list" class="wardrobe-grid"></div>
          </article>
        </section>

        <section id="product-links" class="tab-panel">
          <article class="card">
            <div class="row-between"><h2>产品链接录入</h2><span class="item-meta">离线保存，优先 IndexedDB</span></div>
            <form id="product-form" class="product-form">
              <label>商品链接 URL（必填）<input required name="url" type="url" placeholder="https://item.example.com/123" /></label>
              <label>商品名<input name="name" placeholder="例如：廓形灰西装" /></label>
              <label>平台
                <select name="platform"><option value="">未指定</option><option>淘宝</option><option>天猫</option><option>京东</option><option>得物</option><option>小红书</option><option>抖音</option><option>其它</option></select>
              </label>
              <label>价格<input name="price" type="number" min="0" step="0.01" placeholder="199" /></label>
              <label>分类（必填）
                <select name="category" required><option>Top</option><option>Bottom</option><option>Outer</option><option>Shoes</option><option>Accessory</option></select>
              </label>
              <label>版型
                <select name="fit"><option>regular</option><option>oversize</option><option>slim</option></select>
              </label>
              <label>正式度 0-10<input name="formality" type="number" min="0" max="10" value="5" /></label>
              <label>保暖度 0-10<input name="warmth" type="number" min="0" max="10" value="5" /></label>
              <div>
                <p class="sub-title">颜色标签</p>
                <div class="chip-group inline" id="product-color-chips"><button type="button" class="chip">black</button><button type="button" class="chip">white</button><button type="button" class="chip">gray</button><button type="button" class="chip">beige</button><button type="button" class="chip">khaki</button><button type="button" class="chip">brown</button><button type="button" class="chip">blue</button><button type="button" class="chip">green</button></div>
              </div>
              <div>
                <p class="sub-title">风格标签</p>
                <div class="chip-group inline" id="product-style-chips"><button type="button" class="chip">极简</button><button type="button" class="chip">韩系</button><button type="button" class="chip">美式复古</button><button type="button" class="chip">日系</button><button type="button" class="chip">学院</button><button type="button" class="chip">机能</button><button type="button" class="chip">通勤</button><button type="button" class="chip">约会</button></div>
              </div>
              <label>备注<textarea name="note" rows="2" placeholder="可记录尺码/链接状态"></textarea></label>
              <div id="drop-zone" class="drop-zone" tabindex="0">拖拽图片到这里，或点击上传<input id="product-image" type="file" accept="image/*" hidden /></div>
              <div id="product-image-preview-wrap" class="image-preview-wrap is-hidden"><img id="product-image-preview" alt="产品图预览" /><button id="clear-product-image" type="button">删除重选</button></div>
              <div class="btn-row"><button id="save-product" type="submit" class="primary">保存链接</button><button id="reset-product-form" type="button">重置</button></div>
              <input type="hidden" name="id" />
            </form>

            <div class="product-toolbar">
              <input id="product-search" type="search" placeholder="搜索名称 / 平台 / 标签" />
              <select id="product-sort"><option value="recent">最近添加</option><option value="priceAsc">价格从低到高</option><option value="formalityDesc">正式度优先</option></select>
            </div>
            <div id="product-list" class="product-grid"></div>
          </article>
        </section>

        <section id="favorites" class="tab-panel"><article class="card"><h2>收藏穿搭</h2><div id="favorites-list" class="favorites-list"></div></article></section>
      </main>
    </div>

    <dialog id="add-item-dialog"><form id="add-item-form" class="dialog-form"><h3>新增衣物</h3><label>名称<input required name="name" /></label><label>分类<select name="category"><option>Top</option><option>Bottom</option><option>Outer</option><option>Shoes</option><option>Accessory</option></select></label><label>颜色（逗号分隔）<input name="colors" /></label><label>风格标签（逗号分隔）<input name="styleTags" /></label><label>季节标签（逗号分隔）<input name="seasonTags" /></label><label>正式度 0-10<input type="number" name="formality" min="0" max="10" value="5" /></label><label>保暖度 0-10<input type="number" name="warmth" min="0" max="10" value="5" /></label><label>版型<select name="fit"><option>regular</option><option>oversize</option><option>slim</option></select></label><label>商品截图<input id="image-upload" name="image" type="file" accept="image/*" /></label><div id="image-preview-wrap" class="image-preview-wrap is-hidden"><img id="image-preview" alt="预览图" /><button id="clear-image" type="button">删除重选</button></div><div class="btn-row"><button id="cancel-add" type="button">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>

    <dialog id="image-modal"><div class="image-modal-content"><img id="image-modal-img" alt="单品大图" /><div id="image-modal-detail"></div><button id="close-image-modal" type="button">关闭</button></div></dialog>

    <script src="data/wardrobeData.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
