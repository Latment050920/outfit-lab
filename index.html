<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OutfitLab · 离线穿搭推荐</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>OutfitLab</h1>
          <p class="slogan">今日穿搭，一键有型。</p>
        </div>
        <nav class="tabs" aria-label="页面导航">
          <button class="tab-btn is-active" data-tab="recommend">推荐</button>
          <button class="tab-btn" data-tab="wardrobe">衣橱</button>
          <button class="tab-btn" data-tab="favorites">收藏</button>
        </nav>
      </header>

      <main>
        <section id="recommend" class="tab-panel is-active">
          <div class="grid-two">
            <article class="card">
              <h2>今天想怎么穿？</h2>
              <div class="form-grid">
                <label>心情
                  <select id="mood">
                    <option>冷静</option><option>开心</option><option>疲惫</option>
                    <option>想显气场</option><option>想可爱</option><option>松弛</option>
                  </select>
                </label>
                <label>场景
                  <select id="scene">
                    <option>通勤上班</option><option>约会</option><option>休闲娱乐</option>
                    <option>运动</option><option>聚会</option><option>旅行</option>
                  </select>
                </label>
                <label>温度
                  <div class="segment" id="temp-segment">
                    <button data-value="cold">冷</button>
                    <button class="is-active" data-value="mild">适中</button>
                    <button data-value="hot">热</button>
                  </div>
                </label>
                <label>正式度目标 <span id="formality-value">5</span>
                  <input id="formality" type="range" min="0" max="10" value="5" />
                </label>
              </div>

              <div class="chip-group" id="style-chips">
                <p>风格偏好</p>
                <button class="chip is-active">极简</button><button class="chip">韩系</button>
                <button class="chip">美式复古</button><button class="chip">日系</button>
                <button class="chip">学院</button><button class="chip">机能</button>
              </div>
              <div class="chip-group" id="color-chips">
                <p>颜色倾向</p>
                <button class="chip is-active">黑白灰</button><button class="chip">低饱和</button>
                <button class="chip">亮色点缀</button><button class="chip">大地色</button>
              </div>

              <div class="btn-row">
                <button id="generate" class="primary">生成穿搭</button>
                <button id="reroll">换一套</button>
              </div>
            </article>

            <article class="card result-card" id="result-card">
              <h2>推荐结果</h2>
              <div id="result-content" class="skeleton-wrap"></div>
              <div class="btn-row">
                <button id="favorite">收藏</button>
              </div>
            </article>
          </div>
        </section>

        <section id="wardrobe" class="tab-panel">
          <article class="card">
            <div class="row-between">
              <h2>我的衣橱</h2>
              <button id="add-item-btn">新增单品</button>
            </div>
            <div class="chip-group inline" id="category-filter"></div>
            <div id="wardrobe-list" class="wardrobe-grid"></div>
          </article>
        </section>

        <section id="favorites" class="tab-panel">
          <article class="card">
            <h2>收藏穿搭</h2>
            <div id="favorites-list" class="favorites-list"></div>
          </article>
        </section>
      </main>
    </div>

    <dialog id="add-item-dialog">
      <form method="dialog" id="add-item-form" class="dialog-form">
        <h3>新增衣物</h3>
        <label>名称<input required name="name" /></label>
        <label>分类
          <select name="category">
            <option>Top</option><option>Bottom</option><option>Outer</option><option>Shoes</option><option>Accessory</option>
          </select>
        </label>
        <label>颜色（逗号分隔）<input name="colors" placeholder="black,gray" /></label>
        <label>风格标签（逗号分隔）<input name="styleTags" placeholder="极简,通勤" /></label>
        <label>季节标签（逗号分隔）<input name="seasonTags" placeholder="spring,autumn" /></label>
        <label>正式度 0-10<input type="number" name="formality" min="0" max="10" value="5" /></label>
        <label>保暖度 0-10<input type="number" name="warmth" min="0" max="10" value="5" /></label>
        <label>版型
          <select name="fit"><option>regular</option><option>oversize</option><option>slim</option></select>
        </label>
        <div class="btn-row">
          <button value="cancel">取消</button>
          <button value="submit" class="primary">保存</button>
        </div>
      </form>
    </dialog>

    <script src="data/wardrobeData.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
